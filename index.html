const grid=document.getElementById('grid');
function render(){
  grid.innerHTML='';
  baseLettres.forEach((l,i)=>{
    const div=document.createElement('div');div.className='card';
    div.innerHTML=`<h3>${l.titre}</h3><textarea id="body${i}">${l.corps}</textarea><button onclick="envoyer(${i})">[ ENVOYER ${l.titre} ]</button>`;
    grid.appendChild(div);
  });
  updateLettres();
}
function updateLettres(){
  const num=document.getElementById('numeroInput').value || '{NUMERO}';
  baseLettres.forEach((l,i)=>{
    const ta=document.getElementById(`body${i}`);
    if(ta){
      // On remplace {NUMERO} par le numéro tapé
      let nouveauTexte = l.corps.replace(/{NUMERO}/g, num);
      // Si l'utilisateur a déjà modifié manuellement, on ne veut pas écraser s'il a enlevé le tag, donc on garde logique simple: on remet le modèle + numéro
      // Pour garder les modifs manuelles, on remplace juste le placeholder dans la valeur actuelle
      if(ta.value.includes('{NUMERO}')) {
        ta.value = ta.value.replace(/{NUMERO}/g, num);
      } else {
        // Si le numéro change, on remplace l'ancien numéro par le nouveau
        // Astuce simple: on regénère à partir du modèle
        ta.value = nouveauTexte;
      }
    }
  });
}
function envoyer(i){
  const sujet=encodeURIComponent(baseLettres[i].titre);
  const corps=encodeURIComponent(document.getElementById(`body${i}`).value);
  window.location.href=`mailto:?bcc=${EMAILS}&subject=${sujet}&body=${corps}`;
}
render();

document.getElementById('numeroInput').addEventListener('input', function() {
  const num = this.value.trim() || '{NUMÉRO}';
  document.querySelectorAll('*').forEach(el => {
    if (el.children.length === 0 && el.textContent.includes('{NUMÉRO}')) {
       if (!el.dataset.base) el.dataset.base = el.textContent;
       el.textContent = el.dataset.base.replaceAll('{NUMÉRO}', num);
    }
  });
});
