<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAJI D TOOLS - SIGNALEMENT</title>
<style>
body{background:#000;color:#00ff88;font-family:monospace;padding:15px;display:flex;flex-direction:column;align-items:center}
h1{text-align:center;text-shadow:0 0 10px #00ff88;letter-spacing:4px}
.box{border:2px solid #00ff88;border-radius:12px;padding:15px;width:95%;max-width:550px;background:#001a0f;margin-bottom:10px}
input,textarea{width:100%;background:#000;border:1px solid #00ff88;color:#00ff88;padding:10px;border-radius:8px;margin-top:8px;box-sizing:border-box}
#emails{font-size:11px;height:80px;color:#88ffaa}
.carte{border:1px solid #00ff88;background:#001a0f;padding:15px;border-radius:10px;margin-bottom:15px;width:95%;max-width:700px}
.carte h3{margin:0 0 8px 0;color:#00ff88}
.carte p{white-space:pre-wrap;color:#ccffdd;font-size:13px;line-height:1.5}
.btn{background:#00ff88;color:#000;border:none;padding:8px 12px;border-radius:6px;font-weight:bold;cursor:pointer;margin:5px 5px 0 0}
.btn2{background:#003311;color:#00ff88;border:1px solid #00ff88}
#lettres{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:20px}
</style>
</head>
<body>
<h1>BAJI D<br>TOOLS<br><span style="font-size:0.5em">/// PLUIE VERTE ///</span></h1>

<div class="box">
<label>📟 NUMERO CIBLE (arnaqueur/pirate):</label>
<input id="numero" placeholder="+243..." oninput="generer()">
</div>

<div class="box">
<label>📧 15 ADRESSES ASSISTANCE WHATSAPP (modifiable):</label>
<textarea id="emails">support@whatsapp.com
android_web@support.whatsapp.com
iphone_web@support.whatsapp.com
webclient_web@support.whatsapp.com
sms@support.whatsapp.com
abuse@support.whatsapp.com
business@support.whatsapp.com
business-api@support.whatsapp.com
accessibility@support.whatsapp.com
privacy@whatsapp.com
legal@whatsapp.com
appeals@support.whatsapp.com
security@whatsapp.com
abuse@whatsapp.com
support@fb.com</textarea>
<div style="font-size:10px;opacity:0.6;margin-top:5px">Séparées par retour à la ligne. Tu peux les changer.</div>
</div>

<div id="lettres"></div>

<script>
const baseLettres=[
{titre:"1 - Signalement Arnaque WhatsApp",texte:"Objet: Signalement arnaque - {NUMERO}\n\nBonjour equipe securite WhatsApp,\n\nJe signale le numero {NUMERO} pour tentative d'arnaque, fausses promesses de gains, demande d'argent.\nPreuves: captures d'ecran disponibles.\nMerci de bloquer ce compte pour proteger la communaute.\n\nCordialement."},
{titre:"2 - Piratage de Compte",texte:"Objet: Piratage de compte par {NUMERO}\n\nBonjour,\nMon compte a ete pirate par {NUMERO}. Cette personne se fait passer pour moi et demande de l'argent a mes contacts.\nMon numero legitime: [METTRE VOTRE NUMERO]\nNumero pirate: {NUMERO}\nIntervention urgente SVP."},
{titre:"3 - Usurpation d'Identite",texte:"Objet: Usurpation d'identite - {NUMERO}\n\nLe numero {NUMERO} utilise ma photo de profil et mon nom pour arnaquer.\nC'est une usurpation grave.\nJe demande suspension immediate."},
{titre:"4 - Escroquerie M-Pesa / Airtel Money",texte:"Objet: Escroquerie financiere {NUMERO}\n\nDénonciation d'escroquerie organisee par {NUMERO}\nMode: faux depot, promesse de doubler argent Airtel Money / M-Pesa.\nPlusieurs victimes a Kinshasa."},
{titre:"5 - Harcelement et Menaces",texte:"Objet: Harcelement - {NUMERO}\n\nLe numero {NUMERO} me harcele avec menaces et chantage.\nJe me sens en insecurite. Merci de conserver preuves et bloquer."},
{titre:"6 - Faux Support BAJI D TOOLS",texte:"Objet: Faux support technique - {NUMERO}\n\nLe numero {NUMERO} se fait passer pour le support BAJI D TOOLS et demande des codes OTP a 6 chiffres.\nC'est une arnaque."},
{titre:"7 - Recuperation Compte Vole",texte:"Objet: Aide recuperation compte apres {NUMERO}\n\nJ'ai perdu acces apres interaction avec {NUMERO} qui a vole mon code verification.\nAidez-moi a recuperer mon compte SVP."},
{titre:"8 - Reseau d'Arnaqueurs",texte:"Objet: Groupe d'arnaqueurs - chef {NUMERO}\n\nJe signale un reseau dont {NUMERO} est le chef. Ils ont un groupe WhatsApp avec techniques de piratage."},
{titre:"9 - Lien Phishing Dangereux",texte:"Objet: Phishing envoye par {NUMERO}\n\nLe numero {NUMERO} diffuse un lien phishing qui vole mots de passe Facebook/WhatsApp.\nMerci de bloquer diffusion."},
{titre:"10 - Rapport Officiel Autorites",texte:"Objet: Plainte officielle contre {NUMERO}\n\nJe porte plainte contre titulaire de {NUMERO}\nFaits: escroquerie, piratage, usurpation.\nPreuves: conversations WhatsApp.\nDemande enquete."},
];
function generer(){
 const num=document.getElementById('numero').value||'+243...';
 const cont=document.getElementById('lettres');
 cont.innerHTML='';
 baseLettres.forEach((l,i)=>{
  const txt=l.texte.replaceAll('{NUMERO}',num);
  const div=document.createElement('div');
  div.className='carte';
  div.innerHTML=`<h3>${l.titre}</h3><p id="txt${i}">${txt}</p><button class="btn" onclick="copier(${i})">📋 Copier</button><button class="btn" onclick="envoyerMail(${i})">📧 Envoyer aux 15 mails</button><button class="btn btn2" onclick="envoyerWA(${i})">📤 WhatsApp</button>`;
  cont.appendChild(div);
 });
}
function copier(i){navigator.clipboard.writeText(document.getElementById('txt'+i).innerText);alert('Copié !');}
function envoyerMail(i){
 const txt=document.getElementById('txt'+i).innerText;
 const emails=document.getElementById('emails').value.split('\\n').join(',');
 const sujet=encodeURIComponent(document.querySelectorAll('.carte h3')[i].innerText);
 const body=encodeURIComponent(txt);
 window.location.href=`mailto:${emails}?subject=${sujet}&body=${body}`;
}
function envoyerWA(i){
 const txt=document.getElementById('txt'+i).innerText;
 window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
generer();
</script>
</body>
</html>
