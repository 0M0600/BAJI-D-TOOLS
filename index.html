<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAJI D TOOLS /// PLUIE VERTE ///</title>
<style>
body{margin:0;background:#000;color:#00ff88;font-family:monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;}
h1{color:#00ff88;text-shadow:0 0 10px #00ff88;text-align:center;font-size:2.5em;margin:10px;letter-spacing:5px;line-height:1.2;}
.subtitle{text-align:center;opacity:0.7;margin-bottom:25px;letter-spacing:2px;}
.box{border:2px solid #00ff88;border-radius:15px;padding:20px;width:90%;max-width:500px;box-shadow:0 0 20px #00ff8855;background:#001a0f;margin-bottom:30px;}
.box input{width:100%;background:#000;border:1px solid #00ff88;color:#00ff88;padding:12px;margin-top:10px;border-radius:8px;font-size:18px;box-sizing:border-box;outline:none;}
.box .info{font-size:12px;opacity:0.6;margin-top:8px;}
#lettres{width:95%;max-width:700px;display:flex;flex-direction:column;gap:20px;}
.carte{background:#001a0f;border:1px solid #00ff88;border-radius:12px;padding:18px;box-shadow:0 0 10px #00ff8833;}
.carte h3{margin:0 0 10px 0;color:#00ff88;text-transform:uppercase;}
.carte p{color:#ccffdd;line-height:1.6;white-space:pre-wrap;font-size:14px;}
.carte button{background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:10px;}
</style>
</head>
<body>
<h1>BAJI D<br>TOOLS</h1>
<div class="subtitle">/// PLUIE VERTE ///</div>
<div class="box">
<label>📟 NUMÉRO WHATSAPP CIBLE :</label>
<input type="text" id="numero" placeholder="+243 8XX XXX XXX" oninput="generer()">
<div class="info">Ce numéro sera auto-ajouté dans les 10 lettres de signalement</div>
</div>
<div id="lettres"></div>
<script>
const baseLettres = [
{titre: "1 - Signalement arnaque WhatsApp", texte: `Objet : Signalement d'une tentative d'arnaque\n\nBonjour équipe de sécurité,\n\nJe signale le numéro : {NUMERO}\nCe numéro tente d'arnaquer avec fausses promesses de gains et demandes d'argent.\nMerci de bloquer ce numéro.`},
{titre: "2 - Signalement piratage", texte: `Objet : Mon compte piraté\n\nMon compte a été piraté par le numéro : {NUMERO}\nIl se fait passer pour moi et demande de l'argent à mes contacts.\nMerci d'intervenir urgemment.`},
{titre: "3 - Usurpation d'identité", texte: `Le numéro {NUMERO} utilise ma photo et mon nom pour arnaquer.\nC'est une usurpation grave. Merci de suspendre ce compte.`},
{titre: "4 - Escroquerie financière", texte: `Je dénonce une escroquerie par {NUMERO}\nMode : faux dépôt Airtel Money / M-Pesa, promesse de doubler l'argent.`},
{titre: "5 - Harcèlement et menaces", texte: `Le numéro {NUMERO} me harcèle avec menaces et chantage.\nJe demande des mesures de sécurité.`},
{titre: "6 - Faux support", texte: `Le numéro {NUMERO} se fait passer pour le support BAJI D TOOLS pour voler des codes OTP.`},
{titre: "7 - Récupération de compte", texte: `J'ai perdu l'accès après interaction avec {NUMERO}\nIl a volé mon code à 6 chiffres. Aidez-moi à récupérer.`},
{titre: "8 - Groupe d'arnaqueurs", texte: `Je signale un réseau dont le chef est {NUMERO}\nIls partagent des techniques de piratage dans un groupe.`},
{titre: "9 - Lien de phishing", texte: `Le numéro {NUMERO} envoie un lien de phishing qui vole les mots de passe. Merci de bloquer.`},
{titre: "10 - Rapport officiel autorités", texte: `Rapport officiel contre {NUMERO}\nFaits : escroquerie, piratage, usurpation. Demande d'enquête.`},
];
function generer(){
  const num = document.getElementById('numero').value || '+243 8XX XXX XXX';
  const cont = document.getElementById('lettres');
  cont.innerHTML = '';
  baseLettres.forEach((l, i)=>{
    const texteFinal = l.texte.replaceAll('{NUMERO}', num);
    const div = document.createElement('div');
    div.className = 'carte';
    div.innerHTML = `<h3>${l.titre}</h3><p id="txt${i}">${texteFinal}</p><div><button onclick="navigator.clipboard.writeText(document.getElementById('txt${i}').innerText);alert('Copié!')">📋 Copier</button></div>`;
    cont.appendChild(div);
  });
}
generer();
</script>
</body>
</html>
